<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>voaAM - Esqueci a senha</title>

    <link rel="stylesheet" href="/css/cadastro.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="cadastro-container">

        <!-- IMAGEM DE FUNDO -->
        <div class="cadastro-banner">
            <img src="/img/fundo.png"
                 alt="voaAM - Estudos para vestibulares"
                 class="cadastro-banner-image">
        </div>


        <!-- CARD -->
        <div class="cadastro-section">

            <div class="cadastro-wrapper">

                <div class="cadastro-header">

                    <h1>Redefinir senha</h1>

                    <p>
                        Digite sua nova senha e confirme para
                        recuperar o acesso à sua conta.
                    </p>

                </div>


                <form id="esqueciSenhaForm">

                    <!-- NOVA SENHA -->
                    <div class="input-group">

                        <label for="novaSenha">
                            Digite a nova senha:
                        </label>

                        <div class="input-field-wrapper">

                            <i class="fa-solid fa-lock icon-left"></i>

                            <input
                                type="password"
                                id="novaSenha"
                                name="novaSenha"
                                placeholder="Digite a nova senha"
                                autocomplete="new-password"
                                required
                            >

                            <i
                                class="fa-regular fa-eye-slash icon-right"
                                id="toggleNovaSenha"
                                title="Mostrar senha"
                                aria-label="Mostrar senha"
                                role="button"
                                tabindex="0">
                            </i>

                        </div>

                    </div>


                    <!-- CONFIRMAÇÃO -->
                    <div class="input-group">

                        <label for="confirmarNovaSenha">
                            Confirme a senha:
                        </label>

                        <div class="input-field-wrapper">

                            <i class="fa-solid fa-lock icon-left"></i>

                            <input
                                type="password"
                                id="confirmarNovaSenha"
                                name="confirmarNovaSenha"
                                placeholder="Confirme a nova senha"
                                autocomplete="new-password"
                                required
                            >

                            <i
                                class="fa-regular fa-eye-slash icon-right"
                                id="toggleConfirmarNovaSenha"
                                title="Mostrar senha"
                                aria-label="Mostrar senha"
                                role="button"
                                tabindex="0">
                            </i>

                        </div>

                    </div>


                    <!-- MENSAGEM DE ERRO -->
                    <div
                        id="mensagemSenha"
                        style="
                            display: none;
                            color: #d9534f;
                            font-size: 13px;
                            margin-top: -8px;
                            margin-bottom: 18px;
                        ">
                    </div>


                    <!-- BOTÃO -->
                    <button
                        type="submit"
                        class="btn-submit">

                        <span>Redefinir minha senha</span>

                        <i class="fa-solid fa-check"></i>

                    </button>

                </form>


                <!-- VOLTAR -->
                <div class="cadastro-footer">

                    <p>Já conseguiu acessar sua conta?</p>

                  <a href="/" class="btn-login">
    <i class="fa-solid fa-arrow-left"></i>
    <span>Voltar para o login</span>
</a>

                </div>

            </div>

        </div>

    </div>


    <script src="/js/esqueci-senha.js"></script>

</body>
</html>
