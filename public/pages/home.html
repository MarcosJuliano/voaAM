<!-- pages/home.html — Tela inicial: progresso, vestibulares e ações -->
<!-- ========== HOME ========== -->
<div class="screen active" id="screen-home">
  <main class="page-content home-content">
    <header class="home-hero">
      <div class="home-greeting" id="home-greeting">Olá, estudante! 👋</div>
      <h1 class="home-title">Bora <span class="hi">voar</span> nos vestibulares do Amazonas?</h1>
    </header>

    <div class="progress-card" style="margin: 0 20px 20px;">
      <div class="progress-header">
        <span class="progress-label">Seu progresso geral</span>
        <span class="progress-pct" id="home-pct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="home-bar" style="width:0%"></div></div>
      <div class="progress-stats">
        <div class="pstat">
          <div class="pstat-val" id="stat-aulas">0</div>
          <div class="pstat-lbl">Aulas vistas</div>
        </div>
        <div class="pstat">
          <div class="pstat-val" id="stat-quiz">0</div>
          <div class="pstat-lbl">Questões feitas</div>
        </div>
        <div class="pstat">
          <div class="pstat-val" id="stat-correct">0</div>
          <div class="pstat-lbl">Acertos</div>
        </div>
      </div>
    </div>

    <div class="section-title" id="home-vest-title">Meu vestibular</div>
    <div class="vestibulares-row" id="home-vest-cards">
      <!-- preenchido dinamicamente -->
    </div>

    <div class="section-title">Estudar agora</div>
    <div class="action-cards">
      <button type="button" class="action-card" onclick="goTo('materia')">
        <span class="action-icon mat">📐</span>
        <span class="action-info">
          <span class="action-name">Matemática</span>
          <span class="action-sub" id="home-mat-sub">Comece pelo 1º conteúdo</span>
        </span>
        <span class="action-arrow">›</span>
      </button>
      <button type="button" class="action-card" onclick="goTo('materia')">
        <span class="action-icon red">✏️</span>
        <span class="action-info">
          <span class="action-name">Redação</span>
          <span class="action-sub">Estrutura e repertório</span>
        </span>
        <span class="action-arrow">›</span>
      </button>
      <button type="button" class="action-card" onclick="goTo('praticar')">
        <span class="action-icon sim">🎯</span>
        <span class="action-info">
          <span class="action-name">Simulado</span>
          <span class="action-sub" id="home-sim-sub">Questões reais do seu vestibular</span>
        </span>
        <span class="action-arrow">›</span>
      </button>
    </div>

    <div class="streak-banner" style="margin-top: 16px;">
      <div class="streak-fire">🔥</div>
      <div class="streak-text">
        <div class="streak-days" id="streak-days">0 dias seguidos</div>
        <div class="streak-sub">Não perca sua sequência — estude hoje!</div>
      </div>
    </div>
  </main>
</div>
