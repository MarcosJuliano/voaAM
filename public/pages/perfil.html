<section class="screen" id="screen-perfil" aria-labelledby="perfil-titulo">
  <main class="page-content perfil-page">
    <header class="page-heading">
      <h1 id="perfil-titulo"><svg class="voa-svg-icon" aria-hidden="true"><use href="/assets/icons.svg#settings"></use></svg> Perfil</h1>
      <p>Gerencie seus dados e o acesso à conta.</p>
    </header>

    <section class="perfil-section liquid-glass" aria-labelledby="perfil-dados-titulo">
      <h2 id="perfil-dados-titulo">Dados pessoais e vestibulares</h2>
      <div class="perfil-foto-linha">
        <div class="perfil-avatar">
          <svg id="perfil-foto-padrao" class="voa-svg-icon" aria-hidden="true"><use href="/assets/icons.svg#graduation-cap"></use></svg>
          <img id="perfil-foto" alt="Sua foto de perfil" width="72" height="72" hidden>
        </div>
        <div>
          <label for="perfil-foto-arquivo">Foto do perfil</label>
          <input id="perfil-foto-arquivo" class="form-control" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="perfil-foto-ajuda">
          <p id="perfil-foto-ajuda" class="perfil-ajuda">JPEG, PNG ou WebP de até 950 KB. A foto aparece no Perfil e no Ranking para usuários conectados.</p>
          <button id="perfil-foto-remover" class="btn-secondary" type="button" hidden>Remover foto</button>
          <p id="perfil-foto-status" class="perfil-ajuda" role="status"></p>
        </div>
      </div>
      <form id="perfil-form" class="perfil-form" onsubmit="salvarEdicaoPerfil(event)">
        <label for="editar-nome">Nome</label>
        <input id="editar-nome" class="form-control" maxlength="120" required autocomplete="name">
        <label for="editar-serie">Etapa de estudo</label>
        <select id="editar-serie" class="form-control" required>
          <option value="1">1º ano</option><option value="2">2º ano</option>
          <option value="3">3º ano</option><option value="4">Ensino Médio completo</option>
        </select>
        <fieldset class="perfil-vests"><legend>Vestibulares de interesse</legend>
          <label><input type="checkbox" name="editar-vest" value="ENEM"> ENEM</label>
          <label><input type="checkbox" name="editar-vest" value="PSC"> PSC</label>
          <label><input type="checkbox" name="editar-vest" value="SIS"> SIS</label>
          <label><input type="checkbox" name="editar-vest" value="MACRO"> MACRO</label>
        </fieldset>
        <p id="editar-erro" class="perfil-form-error" role="alert"></p>
        <div id="editar-acoes" hidden><button type="submit" class="btn-primary" id="editar-salvar">Salvar alterações</button></div>
      </form>
    </section>

    <section class="perfil-section perfil-conta liquid-glass" aria-labelledby="perfil-conta-titulo">
      <h2 id="perfil-conta-titulo"><svg class="voa-svg-icon" aria-hidden="true"><use href="/assets/icons.svg#shield-check"></use></svg> Acesso à conta</h2>
      <dl class="perfil-email"><dt>E-mail de acesso</dt><dd id="perfil-email">—</dd></dl>
      <button type="button" class="btn-secondary" onclick="abrirAcaoConta('senha')">Alterar ou definir senha</button>
      <p id="perfil-senha-status" role="status"></p>
      <div class="perfil-google">
        <h3>Login com Google</h3>
        <p id="perfil-google-status" role="status">Verificando conexão com o Google…</p>
        <button id="perfil-google-conectar" type="button" class="btn-secondary" onclick="abrirAcaoConta('vincular')" hidden>Conectar Conta Google</button>
        <button id="perfil-google-desconectar" type="button" class="btn-secondary" onclick="abrirAcaoConta('desvincular')" hidden>Desconectar Conta Google</button>
      </div>
      <div class="perfil-sessao">
        <button type="button" class="btn-secondary" onclick="authLogout()">Sair da conta</button>
        <button id="perfil-excluir" type="button" class="btn-secondary perfil-excluir" onclick="abrirAcaoConta('excluir')" disabled>Excluir minha conta voaAM</button>
      </div>
    </section>
  </main>
</section>

<dialog id="acao-conta" class="conta-dialog liquid-glass" aria-labelledby="acao-conta-titulo" aria-describedby="acao-conta-mensagem">
  <form id="acao-conta-form">
    <h2 id="acao-conta-titulo"></h2>
    <p id="acao-conta-mensagem"></p>
    <div id="acao-conta-senha-atual">
      <label for="acao-conta-senha">Senha atual do voaAM</label>
      <input id="acao-conta-senha" class="form-control" type="password" autocomplete="current-password" maxlength="256">
    </div>
    <div id="acao-conta-nova-senha" hidden>
      <label for="acao-conta-nova">Nova senha (mínimo de 8 caracteres)</label>
      <input id="acao-conta-nova" class="form-control" type="password" autocomplete="new-password" minlength="8" maxlength="256">
    </div>
    <button id="acao-conta-alternar" type="button" class="btn-secondary" hidden></button>
    <div id="acao-conta-google" hidden></div>
    <p id="acao-conta-erro" class="conta-erro" role="alert"></p>
    <div class="sc-dialog-actions">
      <button type="button" id="acao-conta-cancelar">Cancelar</button>
      <button type="submit" id="acao-conta-confirmar"></button>
    </div>
  </form>
</dialog>
