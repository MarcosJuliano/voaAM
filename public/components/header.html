<!-- Barra superior -->
<div class="header">
  <div class="logo" aria-label="voaAM"><div class="logo-text">Voa<span>AM</span></div></div>
  <div class="header-right">
    <div class="header-level" id="header-nivel" title="Seu nível atual">Nível 1/50</div>
    <div class="header-xp" id="xp-display" aria-label="Experiência acumulada"><svg class="voa-svg-icon" aria-hidden="true"><use href="/assets/icons.svg#star"></use></svg><span id="xp-count">0</span> XP</div>
    <div class="vidas-area">
      <button class="vidas-pill" id="vidas-toggle" type="button" aria-expanded="false" onclick="abrirInfoVidas()" aria-label="Mostrar vidas e informações de recarga">
        <svg class="voa-svg-icon" aria-hidden="true"><use href="/assets/icons.svg#heart"></use></svg>
        <span id="vidas-count">3/3</span><span id="vidas-next">Completas</span>
      </button>
      <div id="vidas-ajuda" class="vidas-popover" hidden>
        <strong>Como funcionam as vidas</strong>
        <p>Você tem até 3 vidas. Uma vida retorna a cada 4 horas. Ao concluir um tópico novo, você recebe uma vida extra. Respostas erradas em exercícios consomem vidas.</p>
        <button type="button" onclick="abrirInfoVidas()">Entendi</button>
      </div>
    </div>
    <button class="header-logout" type="button" onclick="authLogout()" title="Sair da conta">Sair</button>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Alternar tema" aria-label="Alternar tema claro e escuro" type="button">
      <span class="theme-toggle-label theme-toggle-label-light">Claro</span>
      <span class="theme-toggle-label theme-toggle-label-dark">Escuro</span>
    </button>
  </div>
</div>
