<section id="treino-overlay" class="assessment-overlay" hidden aria-label="Treino personalizado">
  <header class="aula-header assessment-header">
    <button class="back-btn" type="button" onclick="treinoSair()" aria-label="Sair do treino">←</button>
    <div class="assessment-heading">
      <h2 class="aula-title">Treino personalizado</h2>
      <div class="assessment-progress-row" id="treino-progresso-overlay" aria-live="polite"></div>
      <div class="assessment-progress" id="treino-barra" aria-hidden="true"><span id="treino-progresso-fill"></span></div>
    </div>
  </header>
  <div class="assessment-column">
    <div class="assessment-body" id="treino-scroll">
      <div class="assessment-inner">
        <div id="treino-questao-overlay"></div>
        <p id="treino-feedback-overlay" class="treino-feedback" role="status"></p>
      </div>
    </div>
    <footer class="assessment-footer" id="treino-rodape">
      <div class="assessment-inner assessment-actions">
        <button type="button" id="treino-pular-overlay" class="sc-btn-pular" onclick="treinoPular()">Pular</button>
        <button type="button" id="treino-proxima-overlay" class="sc-btn-prox" onclick="treinoProxima()" disabled>Próxima questão</button>
      </div>
    </footer>
  </div>
  <div id="treino-confirmar-saida" class="sc-dialog-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="treino-dialog-titulo">
    <div class="sc-dialog">
      <h2 id="treino-dialog-titulo">Encerrar treino?</h2>
      <p>As respostas já enviadas foram salvas. Deseja sair antes de terminar?</p>
      <div class="sc-dialog-actions">
        <button type="button" onclick="treinoCancelarSaida()">Continuar treinando</button>
        <button type="button" class="sc-dialog-danger" onclick="treinoConfirmarSaida()">Encerrar</button>
      </div>
    </div>
  </div>
</section>
