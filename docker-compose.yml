services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      PYTHONUNBUFFERED: "1"
    command:
      - python
      - -m
      - flask
      - --app
      - app.py
      - run
      - --host=0.0.0.0
      - --port=5000
      - --debug