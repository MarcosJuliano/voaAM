services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      PYTHONUNBUFFERED: "1"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-dev-only-change-this-key}
      DATABASE_PATH: /app/instance/voaam.db
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ATIVAR_GEMINI: ${ATIVAR_GEMINI:-false}
    command:
      - python
      - -m
      - flask
      - --app
      - app:app
      - run
      - --host=0.0.0.0
      - --port=5000
      - --debug
