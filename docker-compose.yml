services:
  web:
    image: voaam-web
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment: &ambiente_voaam
      PYTHONUNBUFFERED: "1"
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SUPPORT_FROM_EMAIL: ${SUPPORT_FROM_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-dev-only-change-this-key}
      DATABASE_PATH: /app/instance/voaam.db
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      MODERAR_IMAGENS_PERFIL: ${MODERAR_IMAGENS_PERFIL:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ATIVAR_GEMINI: ${ATIVAR_GEMINI:-false}
      ATIVAR_OLLAMA: ${ATIVAR_OLLAMA:-false}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      REDACAO_IA_CONCORRENCIA: ${REDACAO_IA_CONCORRENCIA:-1}
      REDACAO_GEMINI_CONCORRENCIA: ${REDACAO_GEMINI_CONCORRENCIA:-2}
    env_file:
      - .env
    command:
      - python
      - -m
      - flask
      - --app
      - app:app
      - run
      - --host=0.0.0.0
      - --port=5000

  corretor:
    image: voaam-web
    pull_policy: never
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    environment: *ambiente_voaam
    volumes:
      - .:/app
    command: ["python", "-m", "fila_redacao"]
    stop_grace_period: 15s

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: "${REDACAO_IA_CONCORRENCIA:-1}"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
